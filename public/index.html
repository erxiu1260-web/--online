<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云端五子棋</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero"><p class="eyebrow">ONLINE GOMOKU</p><h1>云端五子棋</h1><p>创建房间，把链接发给朋友，即刻开始对局。</p></section>
    <section class="game-card">
      <aside class="sidebar">
        <div class="room-box"><span>当前房间</span><strong id="room-code">—</strong><button id="copy-link">复制邀请链接</button></div>
        <div class="status" id="status" aria-live="polite">正在连接…</div>
        <div class="players"><div><i class="stone black"></i><span>黑方 · 先手</span><b id="black-player">等待加入</b></div><div><i class="stone white"></i><span>白方</span><b id="white-player">等待加入</b></div></div>
        <button class="restart" id="restart">重新开始</button>
        <p class="tip">规则：横、竖、斜线任意连成五子即可获胜。</p>
      </aside>
      <section class="board-wrap"><div id="board" class="board" aria-label="五子棋棋盘"></div></section>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body>
</html>
